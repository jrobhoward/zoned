[package]
name = "zoned"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
authors = ["James Howard <jrobhoward@gmail.com>"]
description = "Pure Rust library for zoned block device management (SMR/ZNS)"
categories = ["filesystem", "hardware-support", "os::linux-apis"]
keywords = ["zoned", "smr", "zns", "block-device", "shingled"]

[dependencies]
libc = "0.2"
nix = { version = "0.30", features = ["ioctl"] }
thiserror = "2.0"

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
tempfile = "3.27"

[lints.clippy]
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
