[package]
name = "zoned"
version = "0.5.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
authors = ["James Howard <jrobhoward@gmail.com>"]
description = "Pure Rust library for zoned block device management (SMR/ZNS)"
repository = "https://github.com/jrobhoward/zoned"
homepage = "https://github.com/jrobhoward/zoned"
documentation = "https://docs.rs/zoned"
readme = "README.md"
exclude = [
    ".github/",
    "docs/HGST.md",
]
categories = ["filesystem", "hardware-support", "os::linux-apis"]
keywords = ["zoned", "smr", "zns", "block-device", "shingled"]

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["ioctl"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync"], optional = true }

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
tempfile = "3.27"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "zone_store_async"
required-features = ["tokio"]

[lints.clippy]
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
